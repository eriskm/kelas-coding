<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServisKu - POS Service HP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50:'#eef2ff', 100:'#e0e7ff', 500:'#6366f1', 600:'#4f46e5', 700:'#4338ca' },
                    }
                }
            }
        }
    </script>
</head>

<body class="h-full bg-gray-100 dark:bg-[#0f1117] font-sans antialiased text-gray-800 dark:text-gray-200 transition-colors">

    <div class="flex h-full">

        <!-- ========== SIDEBAR ========== -->
        <aside class="w-[230px] min-h-screen flex-shrink-0 fixed h-full z-30 bg-white dark:bg-[#16181d] border-r border-gray-200 dark:border-white/5 flex flex-col">

            <!-- Logo -->
            <div class="px-5 py-5 flex items-center gap-3">
                <div class="w-9 h-9 bg-brand-500 rounded-xl flex items-center justify-center shadow-md shadow-brand-500/30">
                    <i class="fa-solid fa-mobile-screen-button text-white text-sm"></i>
                </div>
                <span class="font-extrabold text-lg tracking-tight dark:text-white">ServisKu</span>
            </div>

            <!-- Nav Menu -->
            <nav class="flex-1 px-3 py-2 space-y-1" id="sidebarNav">
                <a href="#" class="nav-link active" data-page="transaksi">
                    <i class="fa-solid fa-money-bill-transfer"></i>
                    <span>Transaksi</span>
                </a>
                <a href="#" class="nav-link" data-page="pelanggan">
                    <i class="fa-solid fa-users"></i>
                    <span>Pelanggan</span>
                </a>
                <a href="#" class="nav-link" data-page="garansi">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>Garansi</span>
                </a>
                <a href="#" class="nav-link" data-page="sparepart">
                    <i class="fa-solid fa-microchip"></i>
                    <span>Sparepart</span>
                </a>
                <a href="#" class="nav-link" data-page="keuangan">
                    <i class="fa-solid fa-coins"></i>
                    <span>Keuangan</span>
                </a>
            </nav>

            <!-- Admin Area -->
            <div class="px-3 pb-4 mt-auto">
                <div class="px-3 py-2 text-[10px] font-bold uppercase tracking-widest text-gray-400 dark:text-gray-500">
                    Admin Area
                </div>
                <a href="#" class="nav-link" data-page="akun">
                    <i class="fa-solid fa-user-gear"></i>
                    <span>Kelola Akun</span>
                </a>
            </div>
        </aside>

        <!-- ========== MAIN AREA ========== -->
        <div class="flex-1 ml-[230px] flex flex-col min-h-full">

            <!-- ===== TOPBAR ===== -->
            <header class="h-16 bg-white dark:bg-[#16181d] border-b border-gray-200 dark:border-white/5 flex items-center justify-between px-6 sticky top-0 z-20">

                <!-- Left: Welcome -->
                <h1 class="text-[15px] font-semibold dark:text-white">
                    Selamat datang, <span id="adminName" class="text-brand-500">Admin</span> 👋
                </h1>

                <!-- Right: DateTime + Weather + Mode + Notification -->
                <div class="flex items-center gap-4">

                    <!-- Jam & Tanggal -->
                    <div class="flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400">
                        <i class="fa-regular fa-calendar"></i>
                        <span id="currentDate">—</span>
                        <span class="text-gray-300 dark:text-gray-600">|</span>
                        <i class="fa-regular fa-clock"></i>
                        <span id="currentTime" class="font-mono font-semibold text-gray-700 dark:text-gray-200">00:00:00</span>
                    </div>

                    <!-- Cuaca -->
                    <div class="flex items-center gap-1.5 text-sm text-gray-500 dark:text-gray-400 px-3 py-1.5 rounded-lg bg-gray-50 dark:bg-white/5">
                        <i class="fa-solid fa-cloud-sun text-amber-400"></i>
                        <span>32°C</span>
                    </div>

                    <!-- Dark / Light Mode Toggle -->
                    <button id="toggleTheme" class="w-9 h-9 rounded-lg flex items-center justify-center bg-gray-100 dark:bg-white/10 hover:bg-gray-200 dark:hover:bg-white/15 transition text-gray-600 dark:text-gray-300">
                        <i class="fa-solid fa-moon text-sm dark:hidden"></i>
                        <i class="fa-solid fa-sun text-sm hidden dark:inline"></i>
                    </button>

                    <!-- Notification -->
                    <button class="relative w-9 h-9 rounded-lg flex items-center justify-center bg-gray-100 dark:bg-white/10 hover:bg-gray-200 dark:hover:bg-white/15 transition text-gray-600 dark:text-gray-300">
                        <i class="fa-solid fa-bell text-sm"></i>
                        <span class="absolute -top-0.5 -right-0.5 bg-red-500 text-white text-[9px] w-[18px] h-[18px] rounded-full flex items-center justify-center font-bold">3</span>
                    </button>
                </div>
            </header>

            <!-- ===== MAIN CONTENT ===== -->
            <main class="flex-1 p-6" id="mainContent">

                <!-- ===== STAR CARDS (5 Financial) ===== -->
                <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-5 gap-4 mb-6" id="starCards"></div>

                <!-- ===== QUICK ACTIONS + INSIGHT ===== -->
                <div class="grid grid-cols-1 xl:grid-cols-2 gap-4 mb-6">

                    <!-- Aksi Cepat -->
                    <div class="bg-white dark:bg-[#16181d] rounded-2xl border border-gray-200 dark:border-white/5 p-5">
                        <h3 class="text-sm font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider mb-4">Aksi Cepat</h3>
                        <div class="grid grid-cols-2 gap-3" id="quickActions"></div>
                    </div>

                    <!-- Insight Hari Ini -->
                    <div class="bg-white dark:bg-[#16181d] rounded-2xl border border-gray-200 dark:border-white/5 p-5">
                        <h3 class="text-sm font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider mb-4">Insight Hari Ini</h3>
                        <div class="grid grid-cols-2 gap-3" id="insightCards"></div>
                    </div>
                </div>

                <!-- ===== TWO LARGE CHARTS ===== -->
                <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
                    <div class="bg-white dark:bg-[#16181d] rounded-2xl border border-gray-200 dark:border-white/5 p-5">
                        <h3 class="text-sm font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider mb-4">Statistik Status Transaksi</h3>
                        <div id="chartStatusTransaksi"></div>
                    </div>
                    <div class="bg-white dark:bg-[#16181d] rounded-2xl border border-gray-200 dark:border-white/5 p-5">
                        <h3 class="text-sm font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider mb-4">Tren Kerusakan Minggu Ini</h3>
                        <div id="chartKerusakan"></div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
